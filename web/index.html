<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugs</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #03110d; color: #d5e6df; font: 15px/1.5 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #start { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 14px; padding: 16px; overflow: auto; }
  [hidden] { display: none !important; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  label, button { font: inherit; color: inherit; background: none; border: 1px solid #3f6a5c; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button.primary { background: #59d3a6; border-color: #59d3a6; color: #02140d; font-weight: 600; }
  label:hover, button:hover { filter: brightness(1.2); }
  :focus-visible, label:focus-within { outline: 2px solid #b6f0da; outline-offset: 2px; }
  label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  p { margin: 0; max-width: 54ch; color: #8fada2; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid #355a4d; border-radius: 4px; padding: 1px 5px; }
  progress { width: min(320px, 80vw); accent-color: #59d3a6; }
  #status[data-error] { color: #ff9d8a; }
  #modes { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: min(560px, calc(100vw - 32px)); }
  #modes.still { opacity: 0; }
  #modes:hover, #modes:focus-within { opacity: 1; }
  #modes { transition: opacity .4s; bottom: auto; top: max(14px, env(safe-area-inset-top)); }
  #modes button[aria-pressed=true] { border-color: #59d3a6; color: #b6f0da; }
  #modes button { background: #041510c0; padding: 6px 12px; min-height: 44px; }
</style>
<!-- Cloudflare Pages adds its analytics script to an explicit body. -->
<body>
<canvas id="view" tabindex="0" aria-label="Toy soldiers marching on a tabletop"></canvas>
<div id="modes" hidden>
  <button data-key="s">Swarm pace</button><button data-key="d">Depth Vision</button><button data-key="p">Pause</button><button data-key="Home">Reset view</button>
  <button id="mute" aria-pressed="false">Mute</button>
</div>
<main id="start">
  <h1>Bugs</h1>
  <button id="play" class="primary" hidden>Start</button>
  <label id="choose">Choose demo folder <input id="folder" type="file" webkitdirectory></label>
  <p id="need">Needs the unpacked files of NVIDIA's demo. They stay on this computer.</p>
  <p>Alien insects swarm over rolling terrain and abandoned machinery.</p>
  <p>Drag to orbit and scroll or pinch to zoom. <kbd>S</kbd> swarm pace · <kbd>P</kbd> pause · <kbd>M</kbd> mute · <kbd>Enter</kbd> full screen</p>
  <p>NVIDIA's “Bugs” demo, 2002.</p>
  <progress id="progress" hidden></progress>
  <p id="status" role="status"></p>
</main>
<script type="module">
  import init, { WebFiles, WebPlayer } from "./pkg/bugs.js";
  const $ = (id) => document.getElementById(id);
  const canvas = $("view");
  const status = (text, error) => {
    $("status").textContent = text;
    $("status").toggleAttribute("data-error", !!error);
  };
  const size = () => {
    const s = window.devicePixelRatio || 1;
    return [Math.round(canvas.clientWidth * s), Math.round(canvas.clientHeight * s)];
  };
  // ?time=&yaw=&pitch=&action=1 shows one still, for checking frames.
  const params = new URLSearchParams(location.search);
  const still = params.has("time");
  let files = null, player = null;

  const sound = {
    sources: {}, buffers: {}, muted: false, loop: null, effect: null,
    open() {
      this.context = new AudioContext();
      this.volume = this.context.createGain();
      this.meter = this.context.createAnalyser();
      this.volume.connect(this.meter).connect(this.context.destination);
      for (const n of ["wind_constant", "bug_screech1"]) this.get(n);
    },
    get(name) {
      return this.buffers[name] ??= (async () => {
        try {
          const own = this.sources[name];
          const data = own ? await own.arrayBuffer() : await fetch(`./local/${name}.flac`).then((r) => r.ok ? r.arrayBuffer() : null);
          return data && await this.context.decodeAudioData(data);
        } catch { return null; } // The demo goes on without sound.
      })();
    },
    async cue(text) {
      const loop = text.endsWith("*"), name = text.replace("*", ""), kind = loop ? "loop" : "effect";
      this[kind]?.node?.stop();
      const entry = this[kind] = { name };
      const buffer = await this.get(name);
      // Another cue may have come while this one was loading.
      if (!buffer || this[kind] !== entry) return;
      entry.node = new AudioBufferSourceNode(this.context, { buffer, loop });
      entry.node.connect(this.volume);
      entry.node.start();
    },
    mute() {
      this.muted = !this.muted;
      this.volume.gain.value = this.muted ? 0 : 1;
      $("mute").setAttribute("aria-pressed", this.muted);
    },
    state() {
      const d = new Float32Array(this.meter.fftSize);
      this.meter.getFloatTimeDomainData(d);
      return { looping: this.loop?.node && this.loop.name, level: Math.max(...d.map(Math.abs)) };
    },
  };

  function offer() {
    $("play").hidden = false;
    $("play").focus();
    status("");
    if (still) start();
  }

  async function start() {
    if (player) return;
    // Browsers allow sound only from a click.
    if (!still) sound.open();
    $("play").disabled = true;
    status("Loading…");
    await new Promise((r) => setTimeout(r));
    try {
      [canvas.width, canvas.height] = size();
      player = await WebPlayer.create(canvas, files);
    } catch (e) {
      console.error(e);
      $("play").disabled = false;
      return status(`Could not start: ${e.message ?? e}`, true);
    }
    status("Preparing graphics…");
    while (!player.ready()) await new Promise((r) => setTimeout(r, 30));
    $("start").hidden = true;
    $("modes").hidden = still;
    canvas.focus();
    run();
  }

  function run() {
    let last = size().join(), n = 0;
    const number = (k) => Number(params.get(k) ?? 0);
    if (still) player.freeze(number("time"), number("yaw"), number("pitch"), number("action") === 1);
    const tick = (now) => {
      const [w, h] = size();
      if (`${w},${h}` !== last) {
        last = `${w},${h}`;
        [canvas.width, canvas.height] = [w, h];
        player.resize(w, h);
      }
      player.frame(now / 1000);
      if (still) {
        if (++n < 3) requestAnimationFrame(tick);
        else document.documentElement.dataset.done = n;
        return;
      }
      for (const c of player.cues()) sound.cue(c);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    if (still) return;
    let hide;
    const wake = () => {
      $("modes").classList.remove("still");
      clearTimeout(hide);
      hide = setTimeout(() => $("modes").classList.add("still"), 4000);
    };
    for (const t of ["pointermove", "pointerdown", "keydown"]) addEventListener(t, wake);
    wake();
    document.addEventListener("visibilitychange", () => document.hidden ? sound.context?.suspend() : sound.context?.resume());

    addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Enter" && e.target.tagName !== "BUTTON") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      else if (e.key === " " && e.target.tagName === "BUTTON") return;
      else if (e.key === "m" || e.key === "M") sound.mute();
      else if (!player.key(e.key)) return;
      e.preventDefault();
    });
    for (const b of $("modes").children) b.addEventListener("click", () => {
      if (b.id === "mute") sound.mute();
      else player.key(b.dataset.key);
      canvas.focus();
    });

    const at = (e) => [e.clientX / canvas.clientWidth, e.clientY / canvas.clientHeight];
    const touches = new Map();
    const gesture = () => {
      const [a, b] = [...touches.values()];
      return { x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2, d: Math.hypot(a[0] - b[0], a[1] - b[1]) };
    };
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      touches.set(e.pointerId, at(e));
      if (touches.size === 1) player.press(...at(e));
      else player.release();
    });
    const up = (e) => {
      if (!touches.delete(e.pointerId)) return;
      player.release();
    };
    for (const t of ["pointerup", "pointercancel"]) canvas.addEventListener(t, up);
    canvas.addEventListener("pointermove", (e) => {
      if (!touches.has(e.pointerId)) return;
      if (touches.size === 1) {
        touches.set(e.pointerId, at(e));
        return player.motion(...at(e));
      }
      if (touches.size !== 2) return;
      const before = gesture();
      touches.set(e.pointerId, at(e));
      const now = gesture();
      player.zoom((now.d - before.d) * 2);
    });
    canvas.addEventListener("wheel", (e) => { e.preventDefault(); player.zoom(-e.deltaY * 0.002); }, { passive: false });
    // For automated checks.
    window.demo = { player, sound: () => sound.state() };
  }

  async function take(list) {
    const found = new WebFiles();
    for (const f of list) {
      if (/\.(nmb|dds|tga|ifl|png)$/i.test(f.name)) found.insert(f.webkitRelativePath.split("/").slice(1).join("/"), new Uint8Array(await f.arrayBuffer()));
      else if (/\.wav$/i.test(f.name)) sound.sources[f.name.toLowerCase().replace(".wav", "")] = f;
    }
    try {
      found.check();
    } catch (e) {
      return status(`That folder will not do: ${e.message ?? e}`, true);
    }
    files = found;
    offer();
  }

  try {
    await init();
  } catch (e) {
    console.error(e);
    status(`Could not load the player: ${e.message ?? e}`, true);
  }
  $("play").addEventListener("click", start);
  $("folder").addEventListener("change", (e) => take([...e.target.files]));
  // Content served with the page: scripts/serve.py locally, or a bundled deployment.
  const mb = (n) => (n / 1e6).toFixed(1);
  try {
    const manifest = await fetch("./local/assets.json").catch(() => null);
    if (manifest?.ok && manifest.headers.get("content-type")?.includes("json")) {
      const { files: names, size: total } = await manifest.json();
      for (const id of ["choose", "need"]) $(id).hidden = true;
      $("progress").hidden = false;
      const parts = [];
      let done = 0;
      for (const name of names) {
        const r = await fetch(`./local/${encodeURIComponent(name)}`);
        if (!r.ok || !r.body) throw new Error(`Asset download failed (${r.status})`);
        for (const reader = r.body.getReader(); ; ) {
          const { done: end, value } = await reader.read();
          if (end) break;
          parts.push(value);
          done += value.length;
          [$("progress").max, $("progress").value] = [total, Math.min(done, total)];
          status(`Downloading ${mb(done)} of ${mb(total)} MB…`);
        }
      }
      if (done !== total) throw new Error("Incomplete asset download");
      files = WebFiles.open(new Uint8Array(await new Blob(parts).arrayBuffer()));
      offer();
    }
  } catch (e) {
    console.error(e);
    for (const id of ["choose", "need"]) $(id).hidden = false;
    status(`Download failed: ${e.message ?? e}`, true);
  }
  $("progress").hidden = true;
</script>
</body>
</html>
