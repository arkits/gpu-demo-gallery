<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipe Dream</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0910; color: #d8d2e4; font: 15px/1.5 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #start { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 14px; padding: 16px; }
  [hidden] { display: none !important; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  label, button { font: inherit; color: inherit; background: none; border: 1px solid #5b4f78; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button.primary { background: #d9772b; border-color: #d9772b; color: #160c04; font-weight: 600; }
  label:hover, button:hover, label:focus-within { filter: brightness(1.2); }
  :focus-visible, label:focus-within { outline: 2px solid #f0b37d; outline-offset: 2px; }
  label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  p { margin: 0; max-width: 52ch; color: #9b92ad; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid #4a4160; border-radius: 4px; padding: 1px 5px; }
  progress { width: min(320px, 80vw); accent-color: #d9772b; }
  #status[data-error] { color: #ff9d8a; }
</style>
<canvas id="view" tabindex="0" aria-label="Pipe Dream animation"></canvas>
<main id="start">
  <h1>Pipe Dream</h1>
  <button id="play" class="primary" hidden>Start</button>
  <div class="row" id="choose">
    <label>Choose demo folder <input id="folder" type="file" webkitdirectory></label>
    <label>Choose files <input id="files" type="file" multiple accept=".ati,.mp3,.tga"></label>
  </div>
  <p id="need">Needs your copy of ATI's demo: <code>Sushi.ati</code>, plus <code>AnimusicIntro.mp3</code> for the music. Files stay on this computer.</p>
  <p><kbd>Space</kbd> pause &nbsp; <kbd>←</kbd> <kbd>→</kbd> skip &nbsp; <kbd>F</kbd> free camera &nbsp; <kbd>1</kbd>–<kbd>4</kbd> views &nbsp; <kbd>L</kbd> logos &nbsp; <kbd>M</kbd> mute &nbsp; <kbd>Enter</kbd> full screen</p>
  <p>Animusic's “Pipe Dream”, © 2001 Animusic. Real-time version by ATI Research, 2002.</p>
  <progress id="progress" hidden></progress>
  <p id="status" role="status"></p>
</main>
<script type="module">
  import init, { WebPlayer } from "./pkg/pipedream.js";
  const $ = (id) => document.getElementById(id);
  const canvas = $("view");
  const status = (text, error) => {
    $("status").textContent = text;
    $("status").toggleAttribute("data-error", !!error);
  };
  const size = () => {
    const s = window.devicePixelRatio || 1;
    return [Math.round(canvas.clientWidth * s), Math.round(canvas.clientHeight * s)];
  };
  // ?t=SECONDS shows one fixed moment, for checking frames.
  const params = new URLSearchParams(location.search);
  const frozen = params.has("t") ? Number(params.get("t")) : null;
  const data = { archive: null, music: null, logo: null };
  let player = null;

  function offer() {
    if (!data.archive) return;
    $("play").hidden = false;
    $("play").focus();
    status(data.music ? "" : "AnimusicIntro.mp3 not found: it will play silently.");
    if (frozen !== null) start();
  }

  async function start() {
    if (player) return;
    $("play").disabled = true;
    status("Loading…");
    const audio = data.music && frozen === null ? new Audio(URL.createObjectURL(data.music)) : null;
    // Unlock audio inside the click; loading takes longer than the gesture lasts.
    if (audio) { audio.muted = true; await audio.play().catch(() => {}); audio.pause(); audio.muted = false; }
    try {
      await new Promise((r) => setTimeout(r));
      [canvas.width, canvas.height] = size();
      player = await WebPlayer.create(canvas, data.archive, data.logo ?? undefined);
    } catch (e) {
      console.error(e);
      $("play").disabled = false;
      return status(`Could not start: ${e.message ?? e}`, true);
    }
    status("Preparing graphics…");
    while (!player.ready()) await new Promise((r) => setTimeout(r, 30));
    data.archive = null;
    $("start").hidden = true;
    canvas.focus();
    if (frozen !== null) player.freeze(frozen);
    run(audio);
  }

  function run(audio) {
    let last = size().join();
    let muted = false;
    const tick = (now) => {
      const [w, h] = size();
      if (`${w},${h}` !== last) {
        last = `${w},${h}`;
        [canvas.width, canvas.height] = [w, h];
        player.resize(w, h);
      }
      if (audio) {
        const seek = player.take_seek();
        if (seek !== undefined) audio.currentTime = seek;
        if (player.paused() && !audio.paused) audio.pause();
        if (!player.paused() && audio.paused && !audio.ended) audio.play().catch(() => {});
        audio.volume = muted ? 0 : player.brightness();
      }
      const playing = audio && !audio.paused && !audio.ended && !audio.seeking;
      player.frame(now / 1000, playing ? audio.currentTime : undefined);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);

    addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "m" || e.key === "M") muted = !muted;
      else if (e.key === "Enter") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      else if (!player.key(e.key)) return;
      e.preventDefault();
    });
    let drag = null;
    canvas.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointerup", () => { drag = null; });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag) return;
      player.drag((e.clientX - drag[0]) * 0.3, (e.clientY - drag[1]) * 0.3);
      drag = [e.clientX, e.clientY];
    });
    canvas.addEventListener("wheel", (e) => { e.preventDefault(); player.zoom(-e.deltaY * 0.001); }, { passive: false });
    // For automated checks.
    window.pipedream = { player, audio };
  }

  async function take(files) {
    for (const f of files) {
      const name = f.name.toLowerCase();
      if (name === "sushi.ati") data.archive = new Uint8Array(await f.arrayBuffer());
      else if (name.endsWith(".mp3")) data.music = f;
      else if (name === "logo2.tga") data.logo = new Uint8Array(await f.arrayBuffer());
    }
    if (!data.archive) return status("Sushi.ati was not among those files.", true);
    offer();
  }

  async function dropped(e) {
    e.preventDefault();
    const files = [];
    const walk = async (entry) => {
      if (entry.isFile) files.push(await new Promise((r, x) => entry.file(r, x)));
      else {
        const reader = entry.createReader();
        for (;;) {
          const batch = await new Promise((r, x) => reader.readEntries(r, x));
          if (!batch.length) break;
          for (const b of batch) await walk(b);
        }
      }
    };
    const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry()).filter(Boolean);
    for (const entry of entries) await walk(entry);
    take(files);
  }

  try {
    await init();
  } catch (e) {
    console.error(e);
    status(`Could not load the player: ${e.message ?? e}`, true);
  }
  $("play").addEventListener("click", start);
  for (const id of ["folder", "files"]) $(id).addEventListener("change", (e) => take(e.target.files));
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", dropped);
  // Content served with the page: scripts/serve.py locally, or a bundled deployment.
  async function get(url, onProgress) {
    const r = await fetch(url).catch(() => null);
    if (!r?.ok) return null;
    const total = Number(r.headers.get("content-length")) || 0;
    const parts = [];
    let done = 0;
    for (const reader = r.body.getReader(); ; ) {
      const { done: end, value } = await reader.read();
      if (end) break;
      parts.push(value);
      onProgress?.((done += value.length), total);
    }
    return new Blob(parts);
  }
  const mb = (n) => (n / 1e6).toFixed(0);
  try {
    const found = await fetch("./local/Sushi.ati", { method: "HEAD" }).catch(() => null);
    if (found?.ok) {
      for (const id of ["choose", "need"]) $(id).hidden = true;
      $("progress").hidden = false;
      const [archive, music, logo] = await Promise.all([
        get("./local/Sushi.ati", (n, total) => {
          if (total) [$("progress").max, $("progress").value] = [total, Math.min(n, total)];
          status(`Downloading ${mb(n)}${total ? ` of ${mb(total)}` : ""} MB…`);
        }),
        get("./local/Audio/AnimusicIntro.mp3"),
        get("./local/Logo2.tga"),
      ]);
      if (!archive) throw new Error("Sushi.ati could not be downloaded");
      data.archive = new Uint8Array(await archive.arrayBuffer());
      data.music = music && new Blob([music], { type: "audio/mpeg" });
      data.logo = logo && new Uint8Array(await logo.arrayBuffer());
      offer();
    }
  } catch (e) {
    console.error(e);
    for (const id of ["choose", "need"]) $(id).hidden = false;
    status(`Download failed: ${e.message ?? e}`, true);
  }
  $("progress").hidden = true;
</script>
</html>
