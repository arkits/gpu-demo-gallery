<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipe Dream</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0910; color: #d8d2e4; font: 15px/1.5 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #start { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 12px; padding: 16px; }
  #start[hidden] { display: none; }
  label { border: 1px solid #5b4f78; border-radius: 6px; padding: 10px 18px; cursor: pointer; justify-self: center; }
  label:hover, label:focus-within { background: #241d35; }
  input { position: absolute; opacity: 0; pointer-events: none; }
  p { margin: 0; max-width: 46ch; color: #9b92ad; }
  #status[data-error] { color: #ff9d8a; }
</style>
<canvas id="view"></canvas>
<main id="start">
  <label>Choose your Sushi.ati <input id="file" type="file" accept=".ati"></label>
  <p>Needs the original demo's <code>Sushi.ati</code>. It stays on this computer.</p>
  <p id="status" role="status"></p>
</main>
<script type="module">
  import init, { WebPlayer } from "./pkg/pipedream.js";
  const $ = (id) => document.getElementById(id);
  const canvas = $("view");
  const status = (text, error) => {
    $("status").textContent = text;
    $("status").toggleAttribute("data-error", !!error);
  };
  const size = () => {
    const s = window.devicePixelRatio || 1;
    return [Math.round(canvas.clientWidth * s), Math.round(canvas.clientHeight * s)];
  };
  // ?t=SECONDS freezes the clock, for checking single frames.
  const params = new URLSearchParams(location.search);
  const frozen = params.has("t") ? Number(params.get("t")) : null;

  async function play(bytes) {
    status("Loading…");
    try {
      [canvas.width, canvas.height] = size();
      const player = await WebPlayer.create(canvas, bytes);
      $("start").hidden = true;
      const begin = performance.now();
      let last = size().join();
      const tick = (now) => {
        const [w, h] = size();
        if (`${w},${h}` !== last) {
          last = `${w},${h}`;
          [canvas.width, canvas.height] = [w, h];
          player.resize(w, h);
        }
        player.frame(frozen ?? Math.max(0, (now - begin) / 1000) % player.duration());
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    } catch (e) {
      console.error(e);
      status(`Could not start: ${e.message ?? e}`, true);
    }
  }
  const read = async (file) => file && play(new Uint8Array(await file.arrayBuffer()));

  await init();
  $("file").addEventListener("change", (e) => read(e.target.files[0]));
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", (e) => { e.preventDefault(); read(e.dataTransfer.files[0]); });
  // Local development: scripts/serve.py exposes the user's own copy here.
  const dev = await fetch("./Sushi.ati").catch(() => null);
  if (dev?.ok) play(new Uint8Array(await dev.arrayBuffer()));
</script>
</html>
