[package]
name = "sushi-formats"
description = "Strict readers for ATI Sushi 2.0 engine data files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "optimization"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
