[package]
name = "grand-bleu"
description = "Grand Bleu player: native window and browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
atb = { path = "../atb" }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.3"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
png = "0.18.1"
wgpu = "30.0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.3"
rfd = "0.18.0"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement"] }
wgpu = { version = "30.0.2", features = ["webgl"] }
